name: AI Complexity Analysis

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Solutions/**/*.cs'  # Triggert ALLEEN als een C#-bestand in Solutions veranderd/toegevoegd is
  workflow_dispatch:

jobs:
  analyze-complexity:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Run Gemini Complexity Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/generate_complexity_reports.py

      - name: Commit and Push Analysis Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Complexity Analyses/"
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: 🤖 add AI complexity analysis report [skip ci]" && git push)