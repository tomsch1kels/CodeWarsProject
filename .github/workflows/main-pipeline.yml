name: CI/CD & Portfolio Automation Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Garandeert dat er max 1 pipeline tegelijk draait op de main branch
concurrency:
  group: main-pipeline-${{ github.ref }}
  cancel-in-progress: false  # Optie A: Wacht netjes tot de vorige pipeline klaar is

jobs:
  # =======================================================
  # STAP 1: .NET CI (Build, Formatting, Roslyn & Tests)
  # =======================================================
  build-and-test:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2 # you can use 2 for example to only fetch the latest 2 commi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Check Code Formatting (dotnet format)
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build & Analyze Code Quality
        run: dotnet build --no-restore -c Release

      - name: Run Tests
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Detect Changed .CS Files
        id: changed-files
        run: |
          # Haal lijst van gewijzigde bestanden in deze push
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED_CS=$(git diff --name-only HEAD~1 HEAD | grep '\.cs$' || true)
          else
            # Voor workflow_dispatch, scan alle bestanden
            CHANGED_CS=""
          fi
          
          echo "has_changed_cs=false" >> $GITHUB_OUTPUT
          
          if [ -n "$CHANGED_CS" ]; then
            echo "has_changed_cs=true" >> $GITHUB_OUTPUT
            
            # Multi-line output voor GitHub Actions
            echo "changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_CS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

    outputs:
      has_changed_cs: ${{ steps.changed-files.outputs.has_changed_cs }}
      changed_files: ${{ steps.changed-files.outputs.changed_files }}

  # =======================================================
  # STAP 2: AI Complexity Analysis (Gemini) - ALLEEN bij .cs wijzigingen
  # =======================================================
  ai-complexity-analysis:
    needs: build-and-test
    if: needs.build-and-test.outputs.has_changed_cs == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Run Gemini Complexity Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANGED_FILES: ${{ needs.build-and-test.outputs.changed_files }}
        run: python .github/scripts/generate_complexity_reports.py

      - name: Commit and Push Complexity Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Complexity Analyses/"
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: 🤖 add AI complexity analysis report [skip ci]" && git push)

  # =======================================================
  # STAP 3: Update README & Status Table
  # =======================================================
  update-readme:
    needs: [build-and-test, ai-complexity-analysis]
    if: needs.build-and-test.outputs.has_changed_cs == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (met nieuwste CA rapporten)
        uses: actions/checkout@v5
        with:
          ref: main # Haalt de nieuwste commit op inclusief de door Stap 2 gepushte .md bestanden

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Generate README with CA Links
        run: python .github/scripts/update_readme.py

      - name: Commit and Push README Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: 🤖 update README status table [skip ci]" && git push)